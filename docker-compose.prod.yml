services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: school_os
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build: ./backend
    restart: unless-stopped
    mem_limit: 768m
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/school_os
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      COOKIE_SECURE: "true"
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-Good School <onboarding@resend.dev>}
      APP_URL: ${APP_URL:-}
      # Schools' custom domains: where their DNS must point, and addresses a
      # school can't claim (comma-separated, besides APP_URL's own host).
      SERVER_PUBLIC_IP: ${SERVER_PUBLIC_IP:-}
      PLATFORM_HOSTS: ${PLATFORM_HOSTS:-}
      # Uploads (staff photos, school logos, academic documents). With all
      # three set, storage goes to Cloudinary; leave them blank to fall back
      # to the backend-uploads disk volume below.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      PORT: 4000
    volumes:
      - backend-uploads:/app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:4000
        # Blank: the browser opens its realtime WebSocket on whichever address
        # the user is on, since the login cookie isn't sent to any other host.
        NEXT_PUBLIC_BACKEND_URL: ""
    restart: unless-stopped
    mem_limit: 512m
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
  backend-uploads:
