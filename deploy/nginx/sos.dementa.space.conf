# Standard nginx WebSocket recipe: Connection is "upgrade" only when the
# client actually asked to upgrade (an empty $http_upgrade means a plain
# HTTP request), so ordinary requests keep normal keep-alive behaviour.
# Needed for the communications module's realtime endpoint
# (/api/v1/communications/realtime) — the browser connects here directly,
# not through the frontend's Next.js rewrite, which can't proxy WS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name sos.dementa.space;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
