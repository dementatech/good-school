# Good School: backend + frontend on one server.
#
# This is the HTTP form; `certbot --nginx` adds the HTTPS parts (see
# deploy/README.md). Ports must match BACKEND_PORT / FRONTEND_PORT in .env.
#
# $connection_upgrade (needed for the realtime WebSocket at
# /api/v1/communications/realtime) must be defined once per nginx install. The
# current server already has it in /etc/nginx/conf.d/aming.conf, and defining it
# twice is an error. On a server without one, add this at http level:
#
#   map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    listen [::]:80;
    server_name goodschool.dementa.space sos.dementa.space;
    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/     { proxy_pass http://127.0.0.1:4010; proxy_read_timeout 300s; }
    location /uploads/ { proxy_pass http://127.0.0.1:4010; }
    location /         { proxy_pass http://127.0.0.1:4011; }
}
